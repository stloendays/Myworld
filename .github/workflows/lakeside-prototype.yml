name: Validate lakeside gameplay prototype
on:
  push:
    branches:
      - feature/lakeside-ecology-prototype-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          Expand-Archive godot.zip -DestinationPath .godot-bin
      - name: Import resources
        shell: pwsh
        run: |
          & ./.godot-bin/Godot_v4.7.2-stable_win64_console.exe --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
      - name: Run existing regression suite
        shell: pwsh
        run: |
          & ./.godot-bin/Godot_v4.7.2-stable_win64_console.exe --headless --path . --fixed-fps 60 res://tests/TestRunner.tscn
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }
